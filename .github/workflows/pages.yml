name: Deploy reviewed website release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to deploy (for example v0.9.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download and verify the reviewed static website
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION="${RELEASE_TAG#v}"
          WEB="Studioodle_${VERSION}_web.zip"
          BASE="${SERVER_URL}/${REPOSITORY}/releases/download/${RELEASE_TAG}"
          curl --fail --location --retry 3 "$BASE/$WEB" --output "$WEB"
          curl --fail --location --retry 3 "$BASE/Studioodle_${VERSION}_SHA256SUMS.txt" --output SHA256SUMS.txt
          grep -F "  $WEB" SHA256SUMS.txt > WEB-SHA256SUM.txt
          sha256sum --check WEB-SHA256SUM.txt
          unzip -q "$WEB" -d site
          test -f site/index.html
          test -f site/app/index.html
          test -f site/licenses/ARTWORK-TERMS.txt
          test -f site/licenses/THIRD-PARTY-NOTICES.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
